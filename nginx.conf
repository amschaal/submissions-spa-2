server {

    listen 8080;
    root /usr/share/nginx/html/;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /static/ {
        alias /data/static/;
    }
    # Only logos are public; submission files are downloaded through the API, which checks access.
    location /media/institutions/ {
        alias /data/media/institutions/;
    }

}
